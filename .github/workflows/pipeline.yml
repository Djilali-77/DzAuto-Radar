name: Car Market Data Pipeline

on:
  schedule:
    # Ça tourne chaque dimanche à minuit (heure UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Hadi tkhallik t'lanciha manuellement men GitHub ki tbghi

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # On donne la permission au bot de faire un "git push"
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Scrapper
        run: python scrapper.py

      - name: Clean Data
        run: python cleaner.py

      - name: Run Anomaly Detection (ML)
        run: python ml_model.py

      - name: Train Regression Model
        run: python regression.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add *.csv *.pkl
          # S'il y a de nouvelles données, il fait un commit, sinon il ignore
          git commit -m "🤖 Auto-update: Fresh car market data & ML models" || echo "No changes to commit"
          git push